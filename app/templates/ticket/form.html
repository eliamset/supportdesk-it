{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Solicitante</label>
                        <select name="empleado_id" class="form-select" required>
                            <option value="">Seleccione un empleado...</option>
                            {% for emp in empleados %}
                            <option value="{{ emp.id }}">{{ emp.nombre }} ({{ emp.area }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <select name="categoria_id" class="form-select" required>
                            <option value="">Seleccione una categoría...</option>
                            {% for cat in categorias %}
                            <option value="{{ cat.id }}">{{ cat.nombre_categoria }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prioridad</label>
                        <select name="prioridad" class="form-select">
                            <option value="Baja">Baja</option>
                            <option value="Media">Media</option>
                            <option value="Alta">Alta</option>
                            <option value="Crítica">Crítica</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Descripción del Problema</label>
                        <textarea name="descripcion" class="form-control" rows="4" placeholder="Describa el incidente detalladamente..." required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Registrar Ticket</button>
                        <a href="{{ url_for('ticket.list') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
